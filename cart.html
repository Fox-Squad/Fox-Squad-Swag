<!DOCTYPE html>
<html>
<head>
<title>Fox Squad Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#111;
    color:white;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:#0b0b0b;
    border-bottom:2px solid #ff6600;
}

.nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    padding:20px;
}

.cart-item{
    background:#222;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.button{
    display:inline-block;
    background:#ff6600;
    color:white;
    text-decoration:none;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    margin:5px 0;
    cursor:pointer;
}

.remove{
    background:#444;
}
</style>
<meta charset="UTF-8">
<link rel="stylesheet" href="site.css">
</head>

<body>



<div class="container">
    <h1>Your Cart</h1>

    <div id="cartItems"></div>

    <h2 id="cartTotal"></h2>
    <p class="price-pending-note">* Items marked Price Pending do not have a confirmed price and are not included in the estimated total.</p>

    <div id="checkoutSection">
        <label for="customerFirstName"><strong>First name</strong></label><br>
        <input id="customerFirstName" type="text" required autocomplete="given-name" placeholder="First name" style="padding:12px; border-radius:8px; border:1px solid #555; margin:8px 0 12px; width:min(320px, 90%); font-size:16px;"><br>
        <label for="customerLastName"><strong>Last name</strong></label><br>
        <input id="customerLastName" type="text" required autocomplete="family-name" placeholder="Last name" style="padding:12px; border-radius:8px; border:1px solid #555; margin:8px 0 12px; width:min(320px, 90%); font-size:16px;">
    </div>

    <div class="cart-actions"><a class="button" href="products.html">Continue Shopping</a>
    <button class="button" id="submitOrderButton" onclick="submitOrder()" disabled>Submit Order</button></div>
</div>

<script src="app.js?v=images-folder-20261007"></script>
<script src="site.js"></script>

<script>
function renderCart(){
    const cart = getCart();
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    cartItems.innerHTML = "";

    if(cart.length === 0){
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
        updateOrderButton();
        cartTotal.textContent = "";
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        total += (Number(item.price) || 0) * item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <h3>${escapeHTML(item.name)}</h3>
                ${Object.entries(item.selections || {}).filter(([key,value])=>value).map(([key,value])=>`<p><strong>${escapeHTML(key)}:</strong> ${escapeHTML(value)}</p>`).join("")}
                <p>Price: ${item.price == null || item.pricePending ? "Price Pending *" : "$" + Number(item.price).toFixed(2)}</p>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;">
                    <strong>Quantity:</strong>
                    <button class="button remove" style="padding:6px 12px;margin:0;" onclick="changeQuantity(${index}, -1)" aria-label="Decrease quantity">−</button>
                    <span style="min-width:24px;text-align:center;font-weight:bold;">${item.quantity}</span>
                    <button class="button" style="padding:6px 12px;margin:0;" onclick="changeQuantity(${index}, 1)" aria-label="Increase quantity">+</button>
                </div>
                <p>Subtotal: ${((Number(item.price) || 0) * item.quantity).toFixed(2)}</p>
                <button class="button" onclick="editItem(${index})">Edit</button>
                <button class="button remove" onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    cartTotal.textContent = "Total: $" + total.toFixed(2);
    updateOrderButton();
}

function changeQuantity(index, change){
    const cart = getCart();
    if(!cart[index]) return;

    const newQuantity = Number(cart[index].quantity) + change;

    if(newQuantity < 1){
        if(confirm("Remove this item from your cart?")){
            cart.splice(index, 1);
        } else {
            return;
        }
    } else {
        cart[index].quantity = newQuantity;
    }

    saveCart(cart);
    updateCartCount();
    renderCart();
}

function editItem(index){
    const cart = getCart();
    if(!cart[index]) return;

    sessionStorage.setItem("foxSquadEditItem", JSON.stringify({
        index: index,
        item: cart[index]
    }));

    window.location.href = "product.html?id=" + encodeURIComponent((cart[index].productId || makeProductId(cart[index].name))) + "&edit=" + index;
}

function removeItem(index){
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    updateCartCount();
    renderCart();
}

const ORDER_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRenQBIbiJtYwwOnSSuZVTRdLSmkcgj7TdKY3IKjsVcmLaucNkUKAAtDhzGEH57QY2YA/exec";
const ORDER_STORAGE_KEY = "foxSquadLastSubmission";
const ORDER_ID_KEY = "foxSquadOrderId";
const firstInput = document.getElementById("customerFirstName");
const lastInput = document.getElementById("customerLastName");
const submitButton = document.getElementById("submitOrderButton");
let sendingOrder = false;
function orderSnapshot(){
    return JSON.stringify({
        firstName: firstInput.value.trim(),
        lastName: lastInput.value.trim(),
        items: getCart()
    });
}
function previousSubmission(){
    try { return JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || "null"); }
    catch(error){ return null; }
}
function updateOrderButton(){
    const prior = previousSubmission();
    submitButton.textContent = sendingOrder ? "Sending..." : prior ? "Update Order" : "Submit Order";
    const cart = getCart();
    const valid = cart.length > 0 && cart.every(item =>
        item.name && Number.isInteger(Number(item.quantity)) && Number(item.quantity) > 0 &&
        (item.pricePending || (item.price !== null && Number.isFinite(Number(item.price))))
    ) && firstInput.value.trim() && lastInput.value.trim();
    submitButton.disabled = Boolean(sendingOrder || !valid || (prior && prior.snapshot === orderSnapshot()));
    submitButton.style.opacity = submitButton.disabled ? "0.4" : "1";
    submitButton.style.cursor = submitButton.disabled ? "not-allowed" : "pointer";
}
function getOrderId(){
    let id = localStorage.getItem(ORDER_ID_KEY);
    if(!id){
        if(!window.crypto || !crypto.randomUUID) throw new Error("A secure order ID could not be generated.");
        id = "FS-" + crypto.randomUUID();
        localStorage.setItem(ORDER_ID_KEY, id);
    }
    return id;
}
async function submitOrder(){
    updateOrderButton();
    if(submitButton.disabled) return;
    const cart = getCart();
    const prior = previousSubmission();
    const firstName = firstInput.value.trim();
    const lastName = lastInput.value.trim();
    const customerName = firstName + " " + lastName;
    const snapshot = orderSnapshot();
    const orderTotal = cart.reduce((total, item) => total + (Number(item.price) || 0) * Number(item.quantity), 0);
    sendingOrder = true;
    updateOrderButton();
    try {
        const orderId = getOrderId();
        await fetch(ORDER_SCRIPT_URL, {
            method:"POST", mode:"no-cors",
            headers:{"Content-Type":"text/plain;charset=utf-8"},
            body:JSON.stringify({
                orderId, action:prior ? "update" : "submit",
                customerName, firstName, lastName, items:cart, orderTotal
            })
        });
        // A no-cors response cannot confirm whether the spreadsheet accepted the update.
        localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify({
            orderId, firstName, lastName, items:cart, snapshot, submittedAt:new Date().toISOString()
        }));
        alert("Order request sent. Your cart has been saved on this browser. Please confirm with the organizer that the " + (prior ? "update" : "order") + " was received.");
    } catch(error){
        console.error("Order submission failed:",error);
        alert("The request could not be sent. Your cart is still saved.");
    } finally {
        sendingOrder = false;
        updateOrderButton();
    }
}
const savedOrder = previousSubmission();
if(savedOrder){
    firstInput.value = savedOrder.firstName || "";
    lastInput.value = savedOrder.lastName || "";
}
firstInput.addEventListener("input", updateOrderButton);
lastInput.addEventListener("input", updateOrderButton);

renderCart();
</script>

</body>
</html>
