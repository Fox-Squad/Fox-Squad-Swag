<!DOCTYPE html>
<html>
<head>
<title>Fox Squad Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#111;
    color:white;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:#0b0b0b;
    border-bottom:2px solid #ff6600;
}

.nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    padding:20px;
}

.cart-item{
    background:#222;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.button{
    display:inline-block;
    background:#ff6600;
    color:white;
    text-decoration:none;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    margin:5px 0;
    cursor:pointer;
}

.remove{
    background:#444;
}
</style>
<meta charset="UTF-8">
<link rel="stylesheet" href="site.css">
</head>

<body>



<div class="container">
    <h1>Your Cart</h1>

    <div id="cartItems"></div>

    <h2 id="cartTotal"></h2>
    <p class="price-pending-note">* Items marked Price Pending do not have a confirmed price and are not included in the estimated total.</p>

    <div id="checkoutSection">
        <label for="customerFirstName"><strong>First name</strong></label><br>
        <input id="customerFirstName" type="text" required autocomplete="given-name" placeholder="First name" style="padding:12px; border-radius:8px; border:1px solid #555; margin:8px 0 12px; width:min(320px, 90%); font-size:16px;"><br>
        <label for="customerLastName"><strong>Last name</strong></label><br>
        <input id="customerLastName" type="text" required autocomplete="family-name" placeholder="Last name" style="padding:12px; border-radius:8px; border:1px solid #555; margin:8px 0 12px; width:min(320px, 90%); font-size:16px;">
        <label for="customerEmail"><strong>Email address</strong></label><br>
        <input id="customerEmail" type="email" required autocomplete="email" placeholder="you@example.com" style="padding:12px; border-radius:8px; border:1px solid #555; margin:8px 0 12px; width:min(320px, 90%); font-size:16px;">
        <p style="color:#bbb;font-size:14px;">Use the same email for future order updates. Secure order retrieval is being configured.</p>
    </div>

    <div class="cart-actions"><a class="button" href="products.html">Continue Shopping</a>
    <button class="button" id="submitOrderButton" onclick="submitOrder()">Submit Order</button></div>
</div>

<script src="app.js?v=images-folder-20261007"></script>
<script src="site.js"></script>

<script>
function renderCart(){
    const cart = getCart();
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    cartItems.innerHTML = "";

    if(cart.length === 0){
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
        cartTotal.textContent = "";
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <h3>${escapeHTML(item.name)}</h3>
                ${Object.entries(item.selections || {}).filter(([key,value])=>value).map(([key,value])=>`<p><strong>${escapeHTML(key)}:</strong> ${escapeHTML(value)}</p>`).join("")}
                <p>Price: ${item.price == null || item.pricePending ? "Price Pending *" : "$" + Number(item.price).toFixed(2)}</p>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;">
                    <strong>Quantity:</strong>
                    <button class="button remove" style="padding:6px 12px;margin:0;" onclick="changeQuantity(${index}, -1)" aria-label="Decrease quantity">−</button>
                    <span style="min-width:24px;text-align:center;font-weight:bold;">${item.quantity}</span>
                    <button class="button" style="padding:6px 12px;margin:0;" onclick="changeQuantity(${index}, 1)" aria-label="Increase quantity">+</button>
                </div>
                <p>Subtotal: ${(item.price * item.quantity).toFixed(2)}</p>
                <button class="button" onclick="editItem(${index})">Edit</button>
                <button class="button remove" onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    cartTotal.textContent = "Total: $" + total.toFixed(2);
}

function changeQuantity(index, change){
    const cart = getCart();
    if(!cart[index]) return;

    const newQuantity = Number(cart[index].quantity) + change;

    if(newQuantity < 1){
        if(confirm("Remove this item from your cart?")){
            cart.splice(index, 1);
        } else {
            return;
        }
    } else {
        cart[index].quantity = newQuantity;
    }

    saveCart(cart);
    updateCartCount();
    renderCart();
}

function editItem(index){
    const cart = getCart();
    if(!cart[index]) return;

    sessionStorage.setItem("foxSquadEditItem", JSON.stringify({
        index: index,
        item: cart[index]
    }));

    window.location.href = "product.html?id=" + encodeURIComponent((cart[index].productId || makeProductId(cart[index].name))) + "&edit=" + index;
}

function removeItem(index){
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    updateCartCount();
    renderCart();
}

async function submitOrder(){
    const cart = getCart();
    const firstInput = document.getElementById("customerFirstName");
    const lastInput = document.getElementById("customerLastName");
    const emailInput = document.getElementById("customerEmail");
    const submitButton = document.getElementById("submitOrderButton");
    const firstName = firstInput.value.trim();
    const lastName = lastInput.value.trim();
    const customerName = firstName + " " + lastName;
    const customerEmail = emailInput.value.trim().toLowerCase();

    if(cart.length === 0){
        alert("Your cart is empty.");
        return;
    }

    if(!firstName || !lastName || !emailInput.validity.valid || !customerEmail){
        alert("Please enter your name before submitting your order.");
        (!firstName ? firstInput : !lastName ? lastInput : emailInput).focus();
        return;
    }

    const orderTotal = cart.reduce((total, item) => {
        return total + (Number(item.price) * Number(item.quantity));
    }, 0);

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    try {
        await fetch("https://script.google.com/macros/s/AKfycbzRenQBIbiJtYwwOnSSuZVTRdLSmkcgj7TdKY3IKjsVcmLaucNkUKAAtDhzGEH57QY2YA/exec", {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                customerName: customerName,
                firstName: firstName,
                lastName: lastName,
                customerEmail: customerEmail,
                items: cart,
                orderTotal: orderTotal
            })
        });

        localStorage.setItem("foxSquadLastSubmission", JSON.stringify({customerName,customerEmail,items:cart,submittedAt:new Date().toISOString()}));
        alert("Order request sent. Your cart has been kept so you can review it. Please confirm with the organizer that your order was received; automatic confirmation and email recall are not active yet.");
    } catch(error) {
        console.error("Order submission failed:", error);
        alert("There was a problem submitting your order. Please try again.");
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit Order";
    }
}

renderCart();
</script>

</body>
</html>
